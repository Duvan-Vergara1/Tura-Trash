# Despliegue en Render con un clic (Blueprint): base de datos, backend y frontend.
# En Render: New > Blueprint > selecciona este repositorio.
databases:
  - name: tura-trash-db
    databaseName: tura_trash
    plan: free

services:
  - type: web
    name: tura-trash-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tura-trash-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false # URL del frontend, ej. https://tura-trash.onrender.com
      - key: ADMIN_NOMBRE
        value: Administrador Tura Trash
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: tura-trash
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # URL del backend, ej. https://tura-trash-api.onrender.com
